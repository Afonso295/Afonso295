<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#0d1f12"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00dc82;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00dc82;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- Grid lines horizontal -->
  <line x1="0" y1="40" x2="900" y2="40" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="80" x2="900" y2="80" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="120" x2="900" y2="120" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="160" x2="900" y2="160" stroke="#ffffff08" stroke-width="1"/>
  <line x1="0" y1="200" x2="900" y2="200" stroke="#ffffff08" stroke-width="1"/>

  <!-- Grid lines vertical -->
  <line x1="100" y1="0" x2="100" y2="220" stroke="#ffffff08" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="220" stroke="#ffffff08" stroke-width="1"/>
  <line x1="300" y1="0" x2="300" y2="220" stroke="#ffffff08" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="220" stroke="#ffffff08" stroke-width="1"/>
  <line x1="500" y1="0" x2="500" y2="220" stroke="#ffffff08" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="220" stroke="#ffffff08" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="220" stroke="#ffffff08" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="220" stroke="#ffffff08" stroke-width="1"/>

  <!-- Geometric accent shapes -->
  <rect x="30" y="30" width="40" height="40" fill="none" stroke="#00dc8230" stroke-width="1.5">
    <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect x="36" y="36" width="28" height="28" fill="none" stroke="#00dc8218" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" from="45 50 50" to="405 50 50" dur="12s" repeatCount="indefinite"/>
  </rect>

  <rect x="830" y="150" width="40" height="40" fill="none" stroke="#58a6ff30" stroke-width="1.5">
    <animateTransform attributeName="transform" type="rotate" from="0 850 170" to="-360 850 170" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect x="836" y="156" width="28" height="28" fill="none" stroke="#58a6ff18" stroke-width="1">
    <animateTransform attributeName="transform" type="rotate" from="45 850 170" to="-315 850 170" dur="10s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner dots at grid intersections -->
  <circle cx="100" cy="80" r="2" fill="#00dc8240"/>
  <circle cx="200" cy="160" r="2" fill="#58a6ff40"/>
  <circle cx="700" cy="80" r="2" fill="#58a6ff40"/>
  <circle cx="800" cy="160" r="2" fill="#00dc8240"/>
  <circle cx="300" cy="40" r="1.5" fill="#00dc8230"/>
  <circle cx="600" cy="200" r="1.5" fill="#58a6ff30"/>

  <!-- Diagonal accent lines -->
  <line x1="60" y1="0" x2="0" y2="60" stroke="#00dc8215" stroke-width="1"/>
  <line x1="840" y1="220" x2="900" y2="160" stroke="#58a6ff15" stroke-width="1"/>

  <!-- Animated scan line -->
  <line x1="0" y1="110" x2="900" y2="110" stroke="url(#lineGrad)" stroke-width="1" opacity="0.6">
    <animate attributeName="y1" values="0;220;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="0;220;0" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Bracket left -->
  <path d="M 140 70 L 120 70 L 120 150 L 140 150" fill="none" stroke="#00dc82" stroke-width="2" filter="url(#glow)" opacity="0.7"/>
  <!-- Bracket right -->
  <path d="M 760 70 L 780 70 L 780 150 L 760 150" fill="none" stroke="#00dc82" stroke-width="2" filter="url(#glow)" opacity="0.7"/>

  <!-- Main name -->
  <text x="450" y="108" text-anchor="middle" font-family="'Courier New', monospace" font-size="38" font-weight="bold" fill="#f0f6fc" letter-spacing="4" filter="url(#glow)">AFONSO CARRASQUINHO</text>

  <!-- Subtitle -->
  <text x="450" y="138" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#00dc82" letter-spacing="6">FRONTEND DEVELOPER</text>

  <!-- Bottom tag -->
  <text x="450" y="168" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#7d8590" letter-spacing="2">Engenharia Informática · Portugal</text>

  <!-- Small decorative dots row -->
  <circle cx="390" cy="182" r="2" fill="#00dc8260"/>
  <circle cx="410" cy="182" r="2" fill="#00dc8280"/>
  <circle cx="430" cy="182" r="2" fill="#00dc82"/>
  <circle cx="450" cy="182" r="2.5" fill="#00dc82"/>
  <circle cx="470" cy="182" r="2" fill="#00dc82"/>
  <circle cx="490" cy="182" r="2" fill="#00dc8280"/>
  <circle cx="510" cy="182" r="2" fill="#00dc8260"/>
</svg>
